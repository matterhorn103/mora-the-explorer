# This file configures mora_the_explorer's *default* internal settings and should not be
# changed by anyone other than the NMR department.

# If you are looking for your user configuration, it is stored in the user's own
# config.toml file, at:
# Windows:  %USERPROFILE%\AppData\Roaming\mora_the_explorer\config.toml
# macOS:    ~/Library/Application Support/mora_the_explorer/config.toml
# Linux:    $XDG_CONFIG_HOME/mora_the_explorer or ~/.config/mora_the_explorer/config.toml

# Values specified in the user version of config.toml take precedence over those
# specified here.

[options]
user = "mjm"
user_name = ""
group = "gil"
spec = "neo400"
repeat_switch = false
repeat_delay = 5

[options.naming]
group = false
user = true
solvent = false
frequency = false
experiment = true
original = false


[appearance]
start_button_colour = "#b88cce"


[paths]
# Paths to the server, different by OS
# Mount point probably needs to be changed by the user on macOS and Linux
windows = "//samba.public.os.wwu.de/usershare/projects/q_nmr-oc/nmr"
darwin = "/Volumes/usershare/projects/q_nmr-oc/nmr"  # darwin = macOS
linux = "~/usershare/projects/q_nmr-oc/nmr"
update = "mora_the_explorer"  # Where to check for app updates, relative to the server
save = "~/nmr"  # The location spectra should be copied to


[admin]
user_name_is_admin_only = true
pattern_separator = '[\s_-]'


[groups]
# Available groups, listed in the style `group = group_name`
# `group` is the standard initialism used for each group's experiments and data
# institute-wide and is used in the search for Bruker spectra (as it must be included in
# the measurement title)
# `group` is the full name, used for folders of the group e.g. for the 500-600er
fer = "fernandez"
gar = "garcia"
gil = "gilmour"
glo = "glorius"
hei = "hein"
nae = "naesborg"
rav = "ravoo"
stu = "studer"

[groups.other]
# Groups that should be put in a separate overflow list called "Other" in the app
ac = "ac"
biochemie = "biochemie"
extern = "extern"
ipc = "ipc"
kb = "kb"
meet = "meet"
nuk = "nuk"
pharmazie = "pharmazie"


[spectrometers]
# Provide the following information for each spectrometer category:
#   manufacturer: the manufacturer of the spectrometer(s)
#   display_name: the text shown next to the button in the user interface
#       (note that some characters need escaping, e.g. write && for &)
#   measurement_pattern: the expected fields in the measurement title
#   date_entry: whether the user selects the full date "dd MMM yyyy" or just year "yyyy"
#   check_paths: the paths that should be searched for new spectra
#   archives: if spectra from previous years can't be found under check_paths, the
#       archive folders are checked in addition
#   include: other spectrometers which should be searched at the same time
#   restrict_to: the list of groups that should be able to see the spectrometer - if
#       this key is not used, the spectrometer will be visible to all
#   admin_only: whether the spectrometer should only be chooseable in admin mode
#   allow_solvent: whether to enable the folder naming option to include the solvent
#   single_check_only: whether users may use multiday and repeat checks for this spec
#
# Possible variable fields in `check_paths` and `archives` are:
# - <group>         (the chosen group's ID)
# - <group_name>    (the chosen group's name)
# - any strftime formatting string, with % characters, enclosed in {}
#   - for the format codes see https://docs.python.org/3/library/datetime.html#strftime-strptime-behavior

[spectrometers.archiv]
manufacturer = "bruker"
display_name = "Pre-2020 archive (Bruker)"
measurement_pattern = '<group!>\_*<user_name>?\_*<user!>\_*<sample_id>'
date_entry = "dd MMM yyyy"
check_paths = [
    "archiv/dpx300/{%y}-dpx300_{%Y}/{%b%d-%Y}",
    "archiv/av300/{%y}-av300_{%Y}/{%b%d-%Y}",
    "archiv/av400/{%y}-av400_{%Y}/{%b%d-%Y}",
    "archiv/neo400a/{%y}-neo400a_{%Y}/neo400a_{%b%d-%Y}",
    "archiv/neo400/{%y}-neo400b_{%Y}/neo400a_{%b%d-%Y}",
    "archiv/neo400c/{%y}-neo400c_{%Y}/neo400c_{%b%d-%Y}",
]
admin_only = true
single_check_only = false

[spectrometers.av300]
manufacturer = "bruker"
display_name = "Studer group NMR only (300 MHz)"
measurement_pattern = '<group!>\_*<user_name>?\_*<user!>\_*<sample_id>'
date_entry = "dd MMM yyyy"
check_paths = [
    "av300/av1/{%b%d-%Y}",
]
archives = [
    "av300/av1/{%y}-av300_{%Y}/{%b%d-%Y}",
]
restrict_to = [
    "stu",
    "nae",
]
single_check_only = false

[spectrometers.neo400]
manufacturer = "bruker"
display_name = "Routine NMR (400 MHz)"
measurement_pattern = '<group!>\_*<user_name>?\_*<user!>\_*<sample_id>'
date_entry = "dd MMM yyyy"
check_paths = [
    "neo400/av1/neo400a_{%b%d-%Y}",
    "neo400/av1/neo400b_{%b%d-%Y}",
    "neo400/av1/neo400c_{%b%d-%Y}",
]
archives = [
    "neo400/av1/{%y}-neo400a_{%Y}/{%b%d-%Y}",
    "neo400/av1/{%y}-neo400b_{%Y}/{%b%d-%Y}",
    "neo400/av1/{%y}-neo400c_{%Y}/{%b%d-%Y}",
]
include = [ "av300" ]
single_check_only = false

[spectrometers.hf]
manufacturer = "agilent"
display_name = "High-field spectrometers (500 && 600 MHz)"
measurement_pattern = '<user!><sample_id>'
date_entry = "yyyy"
check_paths = [
    "500-600er/<group_name>/{%Y}",
]
single_check_only = true
