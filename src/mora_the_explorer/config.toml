# See Configuration in README.md for details on how to use this file.

# Before bundling the app with pyinstaller or compiling it with pyside6-deploy,
# this config file must be transpiled to a QResource, which is done by running:
# `uv run pyside6-rcc ./src/mora_the_explorer/resources.qrc -o ./src/mora_the_explorer/resources.py`

version = 1

[options]
user = "mjm"
group = "gil"
spec = "neo400"
repeat_switch = false
repeat_delay = 5

[options.naming]
sample_format = "{user}-{user2}-{sample_id}"
measurement_format.bruker = "{user}-{user2}-{sample_id}_{instrument}_{submission_time:%d%m%y}_{temperature}k_{experiment}_{measurement_no}"
measurement_format.agilent = "{user}-{user2}-{sample_id}_{instrument}_{completion_time:%d%m%y}_{temperature}k_{experiment}_{measurement_no}"


[appearance]
start_button_colour = "#b88cce"


[paths]
windows = "//wwu/ddfs/Cloud/wwu1/q_nmr-oc/nmr"
darwin = "/Volumes/usershare/projects/q_nmr-oc/nmr"  # darwin = macOS
linux = "~/usershare/projects/q_nmr-oc/nmr"
src = "mora_the_explorer/src/mora-the-explorer"
save = ""


[admin]
pattern_separator = '[\s_-]' # Note the single quotes! (= literal string)
version = "2.0.0"
changelog = """
- Updated for move to new server
- Big rewrite, codebase is now much more structured and maintainable
- Refreshed the UI
- Added an option to check the current date ("today"), which updates accordingly
- Spectra are now always sorted into subfolders by sample (like Agilent spectra)
- Locations now selected using the system file explorer
- Added the ability to set the server address from the GUI (useful on macOS and Linux)
- Various metadata (inc. solvent, instrument, temperature) are now extracted on all spectrometers
- Extracted metadata are now saved to the measurement folder in mora.toml
- CLI and Python API now work entirely independently of a GUI
"""
support_email = "milner@uni-muenster.de"
support_cc = "klaube@uni-muenster.de"


[groups]
fer = "fernandez"
gar = "garcia"
gil = "gilmour"
glo = "glorius"
hei = "hein"
nae = "naesborg"
rav = "ravoo"
stu = "studer"

[groups.other]
ac = "ac"
biochemie = "biochemie"
extern = "extern"
ipc = "ipc"
kb = "kb"
meet = "meet"
nuk = "nuk"
ocf = "ocf"
pharmazie = "pharmazie"


[spectrometers]

[spectrometers.archiv]
manufacturer = "bruker"
display_name = "Pre-2020 archive (Bruker)"
measurement_pattern = '<group!>\_*<user_name>?\_*<user!>\_*<user2!>?\_*<sample_id!>' # Note the single quotes! (= literal string)
date_entry = "dd MMM yyyy"
check_paths = [
    "archiv/dpx300/{date:%y}-dpx300_{date:%Y}/dpx300_{date:%b%d-%Y}",
    "archiv/av300/{date:%y}-av300_{date:%Y}/av300_{date:%b%d-%Y}",
    "archiv/av400/{date:%y}-av400_{date:%Y}/av400_{date:%b%d-%Y}",
    "archiv/neo400a/{date:%y}-neo400a_{date:%Y}/neo400a_{date:%b%d-%Y}",
    "archiv/neo400b/{date:%y}-neo400b_{date:%Y}/neo400b_{date:%b%d-%Y}",
    "archiv/neo400c/{date:%y}-neo400c_{date:%Y}/neo400c_{date:%b%d-%Y}",
]
admin_only = true
single_check_only = false

[spectrometers.av300]
manufacturer = "bruker"
display_name = "Studer group NMR only (300 MHz)"
measurement_pattern = '<group!>\_*<user!>\_*<user2!>?\_*<sample_id!>'
date_entry = "dd MMM yyyy"
check_paths = [
    "av300/av1/av300_{date:%b%d-%Y}",
]
archives = [
    "av300/av1/{date:%y}-av300_{date:%Y}/av300_{date:%b%d-%Y}",
]
restrict_to = [
    "stu",
    "nae",
]
single_check_only = false

[spectrometers.neo400]
manufacturer = "bruker"
display_name = "Routine NMR (300 && 400 MHz)"
measurement_pattern = '<group!>\_*<user!>\_*<user2!>?\_*<sample_id!>'
date_entry = "dd MMM yyyy"
check_paths = [
    "neo400/av1/neo400a_{date:%b%d-%Y}",
    "neo400/av1/neo400b_{date:%b%d-%Y}",
    "neo400/av1/neo400c_{date:%b%d-%Y}",
]
archives = [
    "neo400/av1/{date:%y}-neo400a_{date:%Y}/neo400a_{date:%b%d-%Y}",
    "neo400/av1/{date:%y}-neo400b_{date:%Y}/neo400b_{date:%b%d-%Y}",
    "neo400/av1/{date:%y}-neo400c_{date:%Y}/neo400c_{date:%b%d-%Y}",
]
include = [ "av300" ]
single_check_only = false

[spectrometers.hf]
manufacturer = "agilent"
display_name = "High-field spectrometers (500 && 600 MHz)"
sample_pattern = '<user!><user2!>?<sample_id!>'
measurement_pattern = '<user!><user2!>?<sample_id!>_(\d{6})_<temperature>k_<experiment>_<measurement_no>\.fid'
date_entry = "yyyy"
check_paths = [
    "500-600er/{group_name}/{date:%Y}",
]
archives = [
    "archiv/500-600er/{group_name}/{date:%Y}",
]
single_check_only = true
