[options]
user = "mmu"
user_name = "mustermann"
group = "gil"
inc_user = false
inc_experiment = true
inc_solvent = false
inc_frequency = false
inc_original = false
spec = "av300"
repeat_switch = false
repeat_delay = 5

[appearance]
start_button_colour = "#b88cce"

[paths]
windows = "//samba.public.os.wwu.de/usershare/projects/q_nmr-oc/nmr"
darwin = "/Volumes/usershare/projects/q_nmr-oc/nmr"
linux = "~/usershare/projects/q_nmr-oc/nmr"
update = "mora_the_explorer"
save = "~/Documents/nmr"

[admin]
user_name_is_admin_only = true

[groups]
gil = "gilmour"
glo = "glorius"
stu = "studer"

[groups.other]
biochemie = "biochemie"
pharmazie = "pharmazie"

[spectrometers.dpx300]
spec_dir = "dpx300"
title_format = [ "group", "user:3" ]
date = "%b%d-%Y"
check_paths = [
    "<spec_dir>/{%y}-dpx300_{%Y}/<date>",
]
manufacturer = "bruker"
display_name = "dpx300 (bruker)"
date_entry = "dd MMM yyyy"
single_check_only = false
admin_only = true

[spectrometers.av300]
spec_dir = "av300"
title_format = [ "group", "user:3" ]
date = "%b%d-%Y"
check_paths = [
    "<spec_dir>/<date>",
]
archives = [
    "<spec_dir>/{%y}-av300_{%Y}/<date>",
    "<spec_dir>/{%y}-dpx300_{%Y}/<date>",
]
manufacturer = "bruker"
display_name = "av300 (bruker)"
date_entry = "dd MMM yyyy"
single_check_only = false
restrict_to = [
    "stu",
]

[spectrometers.neo400]
spec_dir = "neo400"
title_format = [ "group", "user:3" ]
date = "%b%d-%Y"
check_paths = [
    "<spec_dir>/neo400a_<date>",
    "<spec_dir>/neo400b_<date>",
    "<spec_dir>/neo400c_<date>",
]
archives = [
    "<spec_dir>/{%y}-av400_{%Y}/<date>",
    "<spec_dir>/{%y}-neo400a_{%Y}/<date>",
    "<spec_dir>/{%y}-neo400b_{%Y}/<date>",
    "<spec_dir>/{%y}-neo400c_{%Y}/<date>",
]
manufacturer = "bruker"
include = [
    "av300",
]
display_name = "neo400 (bruker, inc av300)"
date_entry = "dd MMM yyyy"
single_check_only = false

[spectrometers.v600]
spec_dir = "v600"
title_format = [ "user:3" ]
date = "%Y"
check_paths = [
    "<spec_dir>/<group_name>/<date>",
]
manufacturer = "agilent"
display_name = "v600 (agilent)"
date_entry = "yyyy"
single_check_only = true
