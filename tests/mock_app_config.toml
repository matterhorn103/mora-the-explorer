version = 1

[options]
user = "mmu"
group = "gil"
spec = "av300"
repeat_switch = false
repeat_delay = 5

[options.naming]
sample_format = "{user}-{user2}-{sample_id}"
measurement_format = "{user}-{user2}-{sample_id}_{instrument}_{completion_time:%d%m%y}_{temperature}k_{experiment}_{measurement_no}"

[appearance]
start_button_colour = "#b88cce"

[paths]
windows = "//samba.public.os.wwu.de/usershare/projects/q_nmr-oc/nmr"
darwin = "/Volumes/usershare/projects/q_nmr-oc/nmr"
linux = "~/usershare/projects/q_nmr-oc/nmr"
src = "mora_the_explorer/src/mora-the-explorer"
save = "~/Documents/nmr"

[admin]
pattern_separator = '[\s_-]'
version = "42"
email = "milner@uni-muenster.de"
changelog = """
- No changes, because this is just a mock config
"""

[groups]
gil = "gilmour"
glo = "glorius"
stu = "studer"

[groups.other]
biochemie = "biochemie"
pharmazie = "pharmazie"

[spectrometers.dpx300]
measurement_pattern = '<group!>\_*<user_name>?\_*<user!>\_*<user2!>?\_*<sample_id!>'
check_paths = [
    "dpx300/{date:%y}-dpx300_{date:%Y}/{date:%b%d-%Y}",
]
manufacturer = "bruker"
display_name = "dpx300 (bruker)"
date_entry = "dd MMM yyyy"
single_check_only = false
admin_only = true

[spectrometers.av300]
measurement_pattern = '<group!>\_*<user_name>?\_*<user!>\_*<user2!>?\_*<sample_id!>'
check_paths = [
    "av300/{date:%b%d-%Y}",
]
archives = [
    "av300/{date:%y}-av300_{date:%Y}/{date:%b%d-%Y}",
    "av300/{date:%y}-dpx300_{date:%Y}/{date:%b%d-%Y}",
]
manufacturer = "bruker"
display_name = "av300 (bruker)"
date_entry = "dd MMM yyyy"
single_check_only = false
restrict_to = [
    "stu",
]

[spectrometers.neo400]
measurement_pattern = '<group!>\_*<user_name>?\_*<user!>\_*<user2!>?\_*<sample_id!>'
check_paths = [
    "neo400/neo400a_{date:%b%d-%Y}",
    "neo400/neo400b_{date:%b%d-%Y}",
    "neo400/neo400c_{date:%b%d-%Y}",
]
archives = [
    "neo400/{date:%y}-av400_{date:%Y}/{date:%b%d-%Y}",
    "neo400/{date:%y}-neo400a_{date:%Y}/{date:%b%d-%Y}",
    "neo400/{date:%y}-neo400b_{date:%Y}/{date:%b%d-%Y}",
    "neo400/{date:%y}-neo400c_{date:%Y}/{date:%b%d-%Y}",
]
manufacturer = "bruker"
include = [
    "av300",
]
display_name = "neo400 (bruker, inc av300)"
date_entry = "dd MMM yyyy"
single_check_only = false

[spectrometers.v600]
sample_pattern = '<user!><user2!>?<sample_id!>'
measurement_pattern = '<user!><user2!>?<sample_id!>_(\d{6})_<temperature>k_<experiment>_<measurement_no>\.fid'
check_paths = [
    "v600/{group_name}/{date:%Y}",
]
manufacturer = "agilent"
display_name = "v600 (agilent)"
date_entry = "yyyy"
single_check_only = true
