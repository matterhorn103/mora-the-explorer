[options]
user = "xyz"
user_name = "xavier"
group = "abc"
inc_user = false
inc_solv = false
inc_path = false
spec = "spec1"
repeat_switch = false
repeat_delay = 5

[appearance]
start_button_colour = "#b88cce"

[paths]
windows = "//samba.public.os.wwu.de/usershare/projects/q_nmr-oc/nmr"
darwin = "/Volumes/usershare/projects/q_nmr-oc/nmr"
linux = "~/usershare/projects/q_nmr-oc/nmr"
update = "mora_the_explorer"
save = "~/nmr"

[groups]
abc = "groupabc"
def = "groupdef"
ghi = "groupghi"
jkl = "groupjkl"

[groups.other]
mno = "groupmno"
pqr = "grouppqr"

[spectrometers.spec1]
spec_dir = "spec1er"
date = "%b%d-%Y"
check_paths = [
    "<spec_dir>/<%y>-dpx300_<%Y>/<date>",
]
manufacturer = "bruker"
display_name = "spec1 (bruker, nmr only)"
date_entry = "dd MMM yyyy"
allow_solvent = true
single_check_only = false
admin_only = true

[spectrometers.spec2]
spec_dir = "spec2er"
date = "%b%d-%Y"
check_paths = [
    "<spec_dir>/<date>",
]
archives = [
    "<spec_dir>/<%y>-av300_<%Y>/<date>",
    "<spec_dir>/<%y>-dpx300_<%Y>/<date>",
]
manufacturer = "bruker"
display_name = "spec2 (bruker, abc/nmr only)"
date_entry = "dd MMM yyyy"
allow_solvent = true
single_check_only = false
restrict_to = [
    "abc",
]

[spectrometers.spec3]
spec_dir = "spec3er"
date = "%b%d-%Y"
check_paths = [
    "<spec_dir>/neo400a_<date>",
    "<spec_dir>/neo400b_<date>",
    "<spec_dir>/neo400c_<date>",
]
archives = [
    "<spec_dir>/<%y>-av400_<%Y>/<date>",
    "<spec_dir>/<%y>-neo400a_<%Y>/<date>",
    "<spec_dir>/<%y>-neo400b_<%Y>/<date>",
    "<spec_dir>/<%y>-neo400c_<%Y>/<date>",
]
manufacturer = "bruker"
include = [
    "300er",
]
display_name = "spec3 (bruker, inc spec2)"
date_entry = "dd MMM yyyy"
allow_solvent = true
single_check_only = false

[spectrometers.spec4]
spec_dir = "spec4er"
date = "%Y"
check_paths = [
    "<spec_dir>/<group name>/<date>",
]
manufacturer = "agilent"
display_name = "spec4 (agilent, year, single only)"
date_entry = "yyyy"
allow_solvent = false
single_check_only = true
