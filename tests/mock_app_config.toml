[options]
user = "mmu"
user_name = ""
group = "gil"
spec = "av300"
repeat_switch = false
repeat_delay = 5

[options.naming]
group = false
user = true
solvent = true
instrument = false
frequency = false
experiment = true
original = false

[appearance]
start_button_colour = "#b88cce"

[paths]
windows = "//samba.public.os.wwu.de/usershare/projects/q_nmr-oc/nmr"
darwin = "/Volumes/usershare/projects/q_nmr-oc/nmr"
linux = "~/usershare/projects/q_nmr-oc/nmr"
update = "mora_the_explorer"
save = "~/Documents/nmr"

[admin]
user_name_is_admin_only = true
pattern_separator = '[\s_-]'
version = "42"
email = "milner@uni-muenster.de"
changelog = """
- No changes, because this is just a mock config
"""

[groups]
gil = "gilmour"
glo = "glorius"
stu = "studer"

[groups.other]
biochemie = "biochemie"
pharmazie = "pharmazie"

[spectrometers.dpx300]
measurement_pattern = '<group!>\_*<user_name>?\_*<user!>\_*<sample_id>'
check_paths = [
    "dpx300/{%y}-dpx300_{%Y}/{%b%d-%Y}",
]
manufacturer = "bruker"
display_name = "dpx300 (bruker)"
date_entry = "dd MMM yyyy"
single_check_only = false
admin_only = true

[spectrometers.av300]
measurement_pattern = '<group!>\_*<user_name>?\_*<user!>\_*<sample_id>'
check_paths = [
    "av300/{%b%d-%Y}",
]
archives = [
    "av300/{%y}-av300_{%Y}/{%b%d-%Y}",
    "av300/{%y}-dpx300_{%Y}/{%b%d-%Y}",
]
manufacturer = "bruker"
display_name = "av300 (bruker)"
date_entry = "dd MMM yyyy"
single_check_only = false
restrict_to = [
    "stu",
]

[spectrometers.neo400]
measurement_pattern = '<group!>\_*<user_name>?\_*<user!>\_*<sample_id>'
check_paths = [
    "neo400/neo400a_{%b%d-%Y}",
    "neo400/neo400b_{%b%d-%Y}",
    "neo400/neo400c_{%b%d-%Y}",
]
archives = [
    "neo400/{%y}-av400_{%Y}/{%b%d-%Y}",
    "neo400/{%y}-neo400a_{%Y}/{%b%d-%Y}",
    "neo400/{%y}-neo400b_{%Y}/{%b%d-%Y}",
    "neo400/{%y}-neo400c_{%Y}/{%b%d-%Y}",
]
manufacturer = "bruker"
include = [
    "av300",
]
display_name = "neo400 (bruker, inc av300)"
date_entry = "dd MMM yyyy"
single_check_only = false

[spectrometers.v600]
measurement_pattern = '<user!><sample_id>\_(\d{6})\_(\d{3}k)\_(.+)_\d\.fid'
check_paths = [
    "v600/<group_name>/{%Y}",
]
manufacturer = "agilent"
display_name = "v600 (agilent)"
date_entry = "yyyy"
single_check_only = true
