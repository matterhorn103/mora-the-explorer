[project]
name = "mora-the-explorer"
version = "2.0.0"
description = "A small program for downloading NMR spectra at the Organic Chemistry department at the University of Münster"
authors = [
    { name = "Matthew Milner", email = "matterhorn103@proton.me" }
]
dependencies = [
    "platformdirs>=4.9.6",
    "pyside6-essentials>=6.11.0",
    "tomli-w>=1.2.0",
]
readme = "README.md"
requires-python = ">= 3.13"

[project.scripts]
mora-the-explorer = "mora_the_explorer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pyinstaller>=6.20.0",
    "pip>=26.1",
    "nuitka>=4.0.8",
    "ruff>=0.15.16",
    "ty>=0.0.46",
]

[tool.pytest]
addopts = [
    "--import-mode=importlib",
]
log_file = "pytest.log"
log_file_level = "DEBUG"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [ "src/mora_the_explorer/resources.py" ]

[tool.ty.src]
exclude = [
    "src/mora_the_explorer/resources.py",
    "src/mora_the_explorer/desktop/ui/spinner/",
]
