name: Build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: mora-the-explorer
          - os: windows-latest
            artifact_name: mora-the-explorer.exe
          - os: macos-latest
            artifact_name: mora-the-explorer.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
    
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"

      - name: Install the project
        run: uv sync --locked --dev

      - name: Recompile the resource file
        run: uv run pyside6-rcc src/mora_the_explorer/resources.qrc -o src/mora_the_explorer/resources.py

      - name: Run tests
        run: uv run pytest

      - name: Build pyinstaller bundle
        run: |
          uv run pyinstaller install/pyinstaller.spec

      - name: Rename binary (Linux)
        if: runner.os == 'Linux'
        run: mv build/mora_the_explorer ${{ matrix.artifact_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: mv build/mora_the_explorer.exe ${{ matrix.artifact_name }}

      - name: Rename binary (macOS)
        if: runner.os == 'macOS'
        run: mv build/mora_the_explorer.app ${{ matrix.artifact_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist/

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
